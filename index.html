<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Type Wise Breakdown</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 20px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        
        /* Date Filter Controls */
        .filter-box {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #eef2f5;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-group label {
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        .filter-group input {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-filter {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 7px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-filter:hover {
            background-color: #004085;
        }
        .btn-reset {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 7px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-reset:hover {
            background-color: #5a6268;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background-color: #0d2b45;
            color: white;
            font-weight: 600;
        }
        
        /* Column Colors matching original image */
        .col-discount {
            color: #d97706;
            font-weight: 600;
        }
        .col-received {
            color: #16a34a;
            font-weight: 600;
        }
        .col-pending {
            color: #dc2626;
            font-weight: 600;
        }
        
        /* Grand Total Row Styling */
        tr.grand-total {
            background-color: #f0f4f8;
            font-weight: bold;
        }
        tr.grand-total td {
            border-top: 2px solid #ccc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Overall Vehicle Type Wise Breakdown</h2>

    <!-- Date Section Filter -->
    <div class="filter-box">
        <div class="filter-group">
            <label for="fromDate">From Date:</label>
            <input type="date" id="fromDate">
        </div>
        <div class="filter-group">
            <label for="toDate">To Date:</label>
            <input type="date" id="toDate">
        </div>
        <button class="btn-filter" onclick="applyDateFilter()">Filter</button>
        <button class="btn-reset" onclick="resetFilter()">Reset</button>
    </div>

    <!-- Data Table -->
    <table>
        <thead>
            <tr>
                <th>Vehicle Type</th>
                <th>Count</th>
                <th>Total Fee</th>
                <th>Discount</th>
                <th>Received</th>
                <th>Pending</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Dynamic rows will be inserted here -->
        </tbody>
        <tfoot>
            <tr class="grand-total">
                <td>Grand Total</td>
                <td id="gtCount">0</td>
                <td id="gtTotalFee">₹0</td>
                <td id="gtDiscount" class="col-discount">₹0</td>
                <td id="gtReceived" class="col-received">₹0</td>
                <td id="gtPending" class="col-pending">₹0</td>
            </tr>
        </tfoot>
    </table>
</div>

<script>
    // Sample Data Array (Aap isme apne Firebase ya Backend ki entries pass kar sakte ho)
    const masterEntries = [
        { date: "2026-09-01", type: "AD", totalFee: 16000, discount: 0, received: 8000, pending: 8000 },
        { date: "2026-09-02", type: "Two Wheeler, Four Wheeler", totalFee: 246000, discount: 10200, received: 119600, pending: 116200 },
        { date: "2026-09-05", type: "Commercial / Heavy", totalFee: 92500, discount: 500, received: 42000, pending: 50000 },
        { date: "2026-09-07", type: "Renewal", totalFee: 10400, discount: 1200, received: 8400, pending: 800 },
        { date: "2026-09-10", type: "LDRX, Commercial / Heavy", totalFee: 20000, discount: 11000, received: 5000, pending: 4000 },
        { date: "2026-09-12", type: "Four Wheeler", totalFee: 7000, discount: 0, received: 7000, pending: 0 },
        { date: "2026-09-14", type: "Commercial / Heavy, Crane", totalFee: 20000, discount: 0, received: 10000, pending: 10000 }
    ];

    // Function to render table based on dataset
    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        // Grouping data by vehicle type
        const grouped = {};

        data.forEach(item => {
            if (!grouped[item.type]) {
                grouped[item.type] = { count: 0, totalFee: 0, discount: 0, received: 0, pending: 0 };
            }
            grouped[item.type].count += 1;
            grouped[item.type].totalFee += item.totalFee;
            grouped[item.type].discount += item.discount;
            grouped[item.type].received += item.received;
            grouped[item.type].pending += item.pending;
        });

        let gtCount = 0, gtTotalFee = 0, gtDiscount = 0, gtReceived = 0, gtPending = 0;

        // Populate table rows
        for (const [type, stats] of Object.entries(grouped)) {
            gtCount += stats.count;
            gtTotalFee += stats.totalFee;
            gtDiscount += stats.discount;
            gtReceived += stats.received;
            gtPending += stats.pending;

            const row = `
                <tr>
                    <td><strong>${type}</strong></td>
                    <td>${stats.count}</td>
                    <td>₹${stats.totalFee.toLocaleString('en-IN')}</td>
                    <td class="col-discount">₹${stats.discount.toLocaleString('en-IN')}</td>
                    <td class="col-received">₹${stats.received.toLocaleString('en-IN')}</td>
                    <td class="col-pending">₹${stats.pending.toLocaleString('en-IN')}</td>
                </tr>
            `;
            tbody.innerHTML += row;
        }

        // Update Grand Total Footer
        document.getElementById('gtCount').innerText = gtCount;
        document.getElementById('gtTotalFee').innerText = '₹' + gtTotalFee.toLocaleString('en-IN');
        document.getElementById('gtDiscount').innerText = '₹' + gtDiscount.toLocaleString('en-IN');
        document.getElementById('gtReceived').innerText = '₹' + gtReceived.toLocaleString('en-IN');
        document.getElementById('gtPending').innerText = '₹' + gtPending.toLocaleString('en-IN');
    }

    // Filter Logic
    function applyDateFilter() {
        const fromDate = document.getElementById('fromDate').value;
        const toDate = document.getElementById('toDate').value;

        if (!fromDate && !toDate) {
            alert('Kripya kam se kam ek date select karein!');
            return;
        }

        const filtered = masterEntries.filter(item => {
            const itemDate = item.date;
            if (fromDate && toDate) {
                return itemDate >= fromDate && itemDate <= toDate;
            } else if (fromDate) {
                return itemDate >= fromDate;
            } else if (toDate) {
                return itemDate <= toDate;
            }
            return true;
        });

        renderTable(filtered);
    }

    // Reset Logic
    function resetFilter() {
        document.getElementById('fromDate').value = '';
        document.getElementById('toDate').value = '';
        renderTable(masterEntries);
    }

    // Initial Load
    renderTable(masterEntries);
</script>

</body>
</html>
